model:
  vocab_size: 4096
  embedding_dim: 256
  num_heads: 4
  seq_len: 128

training:
  seed: 0
  steps: 100000
  batch_size: 16
  lr: 3.0e-4
  min_lr_ratio: 0.2
  warmup_steps: 2000
  betas: [0.9, 0.95]
  max_grad_norm: 1.0
  english_data: true
  code_data: true

eval:
  eval_every: 100
  eval_batches: 20
